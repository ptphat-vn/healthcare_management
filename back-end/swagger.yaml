                        $ref: '#/components/schemas/Pagination'
        '400':
          description: Bad request
        '401':
          description: Unauthorized

    post:
      tags:
        - Chat
      summary: Send a message to another user (REST fallback)
      description: Persist a chat message and, if Socket.IO is connected, emit to the conversation room so recipients receive the message in real time.
      operationId: sendMessage
      security:
        - bearerAuth: []
      parameters:
        - name: UserId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
          description: Recipient user ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
              properties:
                content:
                  type: string
                  example: 'Hello, how are you?'
                metadata:
                  type: object
                  additionalProperties: true
      responses:
