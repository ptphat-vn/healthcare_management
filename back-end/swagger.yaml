      responses:
        '200':
          description: Instrument deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Instrument deleted successfully'
                  data:
                    $ref: '#/components/schemas/Instrument'
        '404':
          description: Instrument not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Instrument not found'
        '409':
          description: Conflict - Cannot delete instrument with active reagent assignments
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Cannot delete instrument with active reagent assignments'
        '403':
          description: Insufficient privileges
        '401':
          description: Unauthorized
        '422':
          description: Invalid instrument ID

  /instruments/{id}/reagents:
    get:
      tags:
        - Instruments
      summary: Get instrument reagents
      description: |
        Get all active reagent assignments for a specific instrument.
        **Required Privilege:** `view_instrument`

        **Access:** Admin, Lab Manager, Service
      operationId: getInstrumentReagents
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
          description: Instrument ID
      responses:
        '200':
          description: Instrument reagents retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Get instrument reagents successfully'
                  data:
                    type: object
                    properties:
                      instrument:
                        $ref: '#/components/schemas/Instrument'
                      reagents:
                        type: array
                        items:
                          $ref: '#/components/schemas/InstrumentReagentAssignment'
        '404':
          description: Instrument not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Instrument not found'
        '422':
          description: Invalid instrument ID

    post:
      tags:
        - Instruments
      summary: Add reagent to instrument
      description: |
        Assign a reagent to an instrument. 

        **Automatic Data Retrieval:**
        - The system automatically retrieves `reagentName` from the reagent database using `reagentId`.
        - The system automatically determines the `unit` from the inventory:
          - If `lotNumber` is provided, the unit is taken from that specific lot.
          - If `lotNumber` is not provided, the unit is taken from the first available lot (FIFO).

        **Lot Selection:**
        - If `lotNumber` is provided, the system will use the specified lot (must have sufficient quantity).
        - If `lotNumber` is not provided, the system will automatically select the lot using FIFO (First In First Out) methodology based on earliest expiration date that has sufficient quantity.

        **Human-Readable Fields:**
        - Responses automatically populate `instrumentName`, `assignedByName`, and `vendorSupplyName` when available for better UI presentation.

        **Required Privilege:** `modify_instrument`

        **Access:** Admin, Lab Manager
      operationId: addReagentToInstrument
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
          description: Instrument ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reagentId
                - quantity
              properties:
                reagentId:
                  type: string
                  pattern: '^[0-9a-fA-F]{24}$'
                  description: Reagent ID. The system will automatically retrieve the reagent name and unit from the database.
                  example: '507f1f77bcf86cd799439011'
                quantity:
                  type: number
                  description: Quantity to assign. The unit will be automatically determined from the inventory.
                  example: 10
                lotNumber:
                  type: string
                  description: |
                    Optional. Specify lot number to use. If not provided, system will use FIFO to select the lot automatically.
                    The unit will be determined from the selected lot (or specified lot if provided).
                  example: 'LOT-2024-001'
                notes:
                  type: string
                  description: Optional notes for the assignment.
                  example: 'Assigned for routine testing'
      responses:
        '200':
          description: Reagent added to instrument successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Reagent added to instrument successfully using FIFO'
                  data:
                    $ref: '#/components/schemas/InstrumentReagentAssignment'
        '404':
          description: Instrument, reagent, or specified lot not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Instrument not found'
                    description: |
                      Possible messages:
                      - "Instrument not found"
                      - "Reagent not found"
                      - "Lot number {lotNumber} not found for this reagent"
                      - "Lot number {lotNumber} not found or unit mismatch for this reagent"
        '409':
          description: Conflict - Instrument not active, categories mismatch, or insufficient inventory
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Instrument is not active or No inventory available for this reagent'
                    description: |
                      Possible messages:
                      - "Instrument is not active"
                      - "Instrument {instrumentName} has no categories configured. Please update the instrument categories before assigning reagents."
                      - "Reagent {reagentName} has no categories configured. Please update the reagent categories before assigning it to instruments."
                      - "Instrument {instrumentName} and reagent {reagentName} do not share a common category."
                      - "No inventory available for this reagent"
                      - "No inventory available for this reagent in the unit: {unit}"
                      - "Insufficient quantity in lot {lotNumber}. Available: {available} {unit}, Requested: {requested} {unit}"
                      - "Insufficient inventory. Available: {total} {unit}, Requested: {requested} {unit}"
        '403':
          description: Insufficient privileges
        '401':
          description: Unauthorized
        '422':
          description: Validation error

  /instruments/reagents/{assignmentId}:
    delete:
      tags:
        - Instruments
      summary: Remove reagent from instrument
      description: |
        Remove a reagent assignment from an instrument.

        Response payload includes `removedByName` (along with other human-readable fields) when available.

        **Required Privilege:** `modify_instrument`

        **Access:** Admin, Lab Manager
      operationId: removeReagentFromInstrument
      security:
        - bearerAuth: []
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
          description: Reagent assignment ID
      responses:
        '200':
          description: Reagent removed from instrument successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Reagent removed from instrument successfully'
                  data:
                    $ref: '#/components/schemas/InstrumentReagentAssignment'
        '404':
          description: Assignment not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Reagent assignment not found'
        '409':
          description: Assignment already removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Reagent assignment is already removed'
        '403':
          description: Insufficient privileges
        '401':
          description: Unauthorized
        '422':
          description: Invalid assignment ID
  /notifications:
    get:
      tags:
        - Notifications
      summary: List notifications
      description: List notifications for the authenticated user.
      operationId: getNotifications
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            example: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            example: 20
        - name: unreadOnly
          in: query
          required: false
          description: Return only unread notifications (true|1)
          schema:
            type: boolean
      responses:
        '200':
          description: Notifications retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Notifications fetched'
                  data:
                    type: object
                    properties:
                      notifications:
                        type: array
                        items:
                          $ref: '#/components/schemas/Notification'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '401':
          description: Unauthorized

  /notifications/summary:
    get:
      tags:
        - Notifications
      summary: Notifications summary
      description: Get unread count and latest notifications for badge/preview
      operationId: getNotificationsSummary
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Notifications summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Notifications summary'
                  data:
                    type: object
                    properties:
                      unreadCount:
                        type: integer
                        example: 3
                      latest:
                        type: array
                        items:
                          $ref: '#/components/schemas/Notification'
        '401':
          description: Unauthorized

  /notifications/{id}/read:
    put:
      tags:
        - Notifications
      summary: Mark notification as read
      description: Mark a single notification as read for the authenticated user
      operationId: markNotificationRead
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Notification ID
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
      responses:
        '200':
          description: Notification marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Notification marked as read'
                  data:
                    $ref: '#/components/schemas/Notification'
        '400':
          description: Invalid notification id
        '401':
          description: Unauthorized

  /notifications/read-all:
    put:
      tags:
        - Notifications
      summary: Mark all notifications as read
      description: Mark all notifications as read for the authenticated user
      operationId: markAllNotificationsRead
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All notifications marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'All notifications marked as read'
                  data:
                    type: object
                    properties:
                      modifiedCount:
                        type: integer
                        example: 5
        '401':
          description: Unauthorized

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from login endpoint

  schemas:
    User:
      type: object
      properties:
        _id:
          type: string
          example: '507f1f77bcf86cd799439011'
        fullName:
          type: string
          example: 'Nguyễn Văn A'
        email:
          type: string
          format: email
          example: 'user@example.com'
        phoneNumber:
          type: string
          example: '0123456789'
        identifyNumber:
          type: string
          example: '123456789'
        gender:
          type: string
          enum: [male, female]
          example: 'male'
        address:
          type: string
          example: '123 Main Street, City'
        dateOfBirth:
          type: string
          format: date
          example: '1990-01-01'
        roleId:
          type: string
          example: '507f1f77bcf86cd799439099'
        status:
          type: integer
          enum: [0, 1, 2]
          description: |
            0 - Inactive (soft deleted)
            1 - Active
            2 - Locked
          example: 1
        createdAt:
          type: string
          format: date-time
          example: '2023-01-01T00:00:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2023-01-01T00:00:00.000Z'

    Role:
      type: object
      properties:
        _id:
          type: string
          example: '507f1f77bcf86cd799439022'
        name:
          type: string
          example: 'Lab Manager'
        code:
          type: string
          enum: [admin, lab_manager, service, lab_user, patient]
          example: 'lab_manager'
        description:
          type: string
          example: 'Manage lab and users'
        privileges:
          type: array
          items:
            type: string
            enum:
              [
                '*',
                read_only,
                view_role,
                create_role,
                update_role,
                delete_role,
                view_config,
                create_config,
                modify_config,
                delete_config,
                view_user,
                modify_user,
                delete_user,
                lock_unlock_user,
                add_comment,
                modify_comment,
                delete_comment,
                create_test_order,
                delete_test_order,
                review_test_order,
                modify_test_order,
                execute_blood_testing,
                view_instrument,
                create_instrument,
                modify_instrument,
                delete_instrument,
                activate_instrument,
                deactivate_instrument,
                view_event_logs
              ]
          example:
            [
              'view_role',
              'create_role',
              'update_role',
              'view_config',
              'create_config',
              'modify_config',
              'delete_config',
              'view_user',
              'modify_user',
              'delete_user',
              'lock_unlock_user',
              'add_comment',
              'modify_comment',
              'delete_comment',
              'review_test_order',
              'modify_test_order'
            ]
        createdAt:
          type: string
          format: date-time
          example: '2023-01-01T00:00:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2023-01-01T00:00:00.000Z'

    Error:
      type: object
      properties:
        message:
          type: string
          example: 'Error message'
        errors:
          type: object
          additionalProperties:
            type: string
          example:
            email: 'Email is required'
            password: 'Password must be at least 8 characters'

    ValidationError:
      type: object
      properties:
        message:
          type: string
          example: 'Dữ liệu không hợp lệ'
        errors:
          type: object
          additionalProperties:
            type: string
          example:
            email: 'Email không đúng định dạng'
            password: 'Mật khẩu phải có ít nhất 8 ký tự'
    Operator:
      type: object
      properties:
        id:
          type: string
          example: '507f1f77bcf86cd799439011'
        name:
          type: string
          example: 'Nguyễn Văn A'
        role:
          type: string
          example: 'manager'

    EventLog:
