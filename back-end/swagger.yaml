  # Patient Medical Record Management endpoints
  /patient-records:
    post:
      tags:
        - Patient Medical Records
      summary: Create a new patient medical record
      description: Create a new patient medical record with comprehensive information
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
              properties:
                userId:
                  type: string
                  example: '507f1f77bcf86cd799439011'
                  description: MongoDB user _id of an existing user with role patient
                emergencyContact:
                  type: object
                  properties:
                    name:
                      type: string
                      example: 'Nguyễn Thị B'
                    phoneNumber:
                      type: string
                      example: '0987654321'
                    relationship:
                      type: string
                      example: 'Spouse'
                medicalHistory:
                  type: object
                  properties:
                    allergies:
                      type: array
                      items:
                        type: string
                      example: ['Penicillin', 'Shellfish']
                    chronicConditions:
                      type: array
                      items:
                        type: string
                      example: ['Diabetes', 'Hypertension']
                    medications:
                      type: array
                      items:
                        type: string
                      example: ['Metformin', 'Lisinopril']
                    previousSurgeries:
                      type: array
                      items:
                        type: string
                      example: ['Appendectomy']
                insuranceInfo:
                  type: object
                  properties:
                    provider:
                      type: string
                      example: 'Bảo Việt Insurance'
                    policyNumber:
                      type: string
                      example: 'BV123456789'
                    expiryDate:
                      type: string
                      format: date
                      example: '2025-12-31'
      responses:
        '201':
          description: Patient medical record created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Patient medical record created successfully'
                  data:
                    $ref: '#/components/schemas/PatientMedicalRecord'
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '409':
          description: Patient ID or identity number already exists

    get:
      tags:
        - Patient Medical Records
      summary: Get list of patient medical records
      description: |
        Retrieve a paginated list of patient medical records with search and filter options.
        
        **Patient Access Restriction:** Users with role `patient` can only view their own medical records. 
        The system automatically filters results to show only the authenticated patient's medical record.
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          description: Search by patient name, ID, or identity number
          schema:
            type: string
          example: 'Nguyễn'
        - name: gender
          in: query
          description: Filter by gender
          schema:
            type: string
            enum: [male, female]
          example: 'male'
        - name: dateOfBirthFrom
          in: query
          description: Filter by date of birth from
          schema:
            type: string
            format: date
          example: '1990-01-01'
        - name: dateOfBirthTo
          in: query
          description: Filter by date of birth to
          schema:
            type: string
            format: date
          example: '2000-12-31'
        - name: testType
          in: query
          description: Filter by test type
          schema:
            type: string
          example: 'Blood Test'
        - name: instrumentUsed
          in: query
          description: Filter by instrument used
          schema:
            type: string
          example: 'Analyzer-001'
        - name: dateRangeFrom
          in: query
          description: Filter by date range from
          schema:
            type: string
            format: date
          example: '2024-01-01'
        - name: dateRangeTo
          in: query
          description: Filter by date range to
          schema:
            type: string
            format: date
          example: '2024-12-31'
        - name: sortBy
          in: query
          description: Sort field
          schema:
            type: string
            enum: [fullName, email, createdAt, lastTestDate]
          example: 'createdAt'
        - name: sortOrder
          in: query
          description: Sort order (1 for ascending, -1 for descending)
          schema:
            type: integer
            enum: [1, -1]
          example: -1
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            minimum: 1
          example: 1
        - name: limit
          in: query
          description: Items per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
          example: 10
      responses:
        '200':
          description: Patient records retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Patient records retrieved successfully'
                  data:
                    type: object
                    properties:
                      patient:
                        type: array
                        items:
                          allOf:
                            - $ref: '#/components/schemas/PatientMedicalRecord'
                            - type: object
                              properties:
                                lastTestDate:
                                  type: string
                                  format: date-time
                                  example: '2024-01-15T10:30:00Z'
                                lastTestStatus:
                                  type: string
                                  example: 'completed'
                                createdByUser:
                                  type: object
                                  properties:
                                    fullName:
                                      type: string
                                    email:
                                      type: string
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Patient users can only access their own medical records

  /patient-records/{id}:
    get:
      tags:
        - Patient Medical Records
      summary: Get patient medical record details
      description: |
        Retrieve detailed information of a specific patient medical record, including test orders and clinical notes.
        
        **Patient Access Restriction:** Users with role `patient` can only view their own medical record details. 
        Attempting to access another patient's medical record will result in a 403 Forbidden error.
      security:
