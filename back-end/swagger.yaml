                        example: true
                      model:
                        type: string
                        example: 'gemini-2.5-pro'
                      sample:
                        type: string
                        nullable: true
                        example: 'OK - gemini-2.5-pro'
        '401':
          description: Unauthorized

  # Reagent Management endpoints
  /reagents:
    get:
      tags:
        - Reagents
      summary: List reagents
      description: |
        Get a paginated list of reagents. Results are sorted by latest date (updatedAt) by default.

        **Required Privilege:** `view_reagent`

        **Access:** Admin, Lab Manager, Service
      operationId: listReagents
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Search by name, description, catalogNumber, or manufacturer
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
            enum: [name, createdAt, updatedAt]
            default: updatedAt
        - name: sortOrder
          in: query
          required: false
          schema:
            type: integer
            enum: [1, -1]
            default: -1
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
        - name: isActive
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Reagents retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Get reagents successfully'
                  data:
                    type: object
                    properties:
                      reagents:
                        type: array
                        items:
                          $ref: '#/components/schemas/Reagent'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '403':
          description: Insufficient privileges

    post:
      tags:
        - Reagents
      summary: Create reagent
      description: |
        Create a new reagent with specified properties.

        **CAS Number Auto-generation:**
        - If `casNumber` is not provided, the system will automatically generate a unique random CAS Number
        - CAS Number format: number-number-number (e.g., 7732-18-5)
        - CAS Number must be unique across all reagents
        - Generated CAS Numbers are guaranteed to be unique (no duplicates)

        **Categories:**
        - A reagent can belong to multiple categories
        - Valid categories: Hematology, Biochemistry, Immunology, Molecular/PCR, Microbiology, Coagulation, Enzyme

        **Required Privilege:** `create_reagent`

        **Access:** Admin, Lab Manager
      operationId: createReagent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - description
                - usagePerRun
              properties:
                name:
                  type: string
                  example: 'Diluent'
                catalogNumber:
                  type: string
                  example: 'CAT-001'
                manufacturer:
                  type: string
                  example: 'ABC Chemicals'
                casNumber:
                  type: string
                  description: |
                    Optional. CAS Number in format: number-number-number (e.g., 7732-18-5).
                    If not provided, system will automatically generate a unique random CAS Number.
                  example: '7732-18-5'
                description:
                  type: string
                  example: 'Typically used in a 1:10 to 1:20 ratio with blood samples'
                usagePerRun:
                  type: object
                  required:
                    - min
                    - max
                    - unit
                  properties:
                    min:
                      type: number
                      example: 1
                    max:
                      type: number
                      example: 2
                    unit:
                      type: string
                      enum: [ml, μL, L]
                      example: 'ml'
                ratio:
                  type: string
                  example: '1:10 to 1:20'
                categories:
                  type: array
                  description: 'Array of category names. Must be from predefined list: Hematology, Biochemistry, Immunology, Molecular/PCR, Microbiology, Coagulation, Enzyme'
                  items:
                    type: string
                    enum:
                      - Hematology
                      - Biochemistry
                      - Immunology
                      - 'Molecular/PCR'
                      - Microbiology
                      - Coagulation
                      - Enzyme
                  example:
                    - Hematology
                    - Biochemistry
                storageCondition:
                  type: number
                  description: Storage temperature in degrees Celsius
                  example: 4
      responses:
        '200':
          description: Reagent created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Reagent created successfully'
                  data:
                    $ref: '#/components/schemas/Reagent'
        '400':
          description: |
            Bad request. Possible reasons:
            - Invalid categories (not from predefined list)
            - Failed to generate unique CAS Number
        '409':
          description: |
            Conflict. Possible reasons:
            - Reagent with this name already exists
            - Reagent with this CAS Number already exists
        '422':
          description: Validation error
        '500':
          description: Internal server error (e.g., failed to generate unique CAS Number)

  /reagents/{id}:
    get:
      tags:
        - Reagents
      summary: Get reagent by ID
      description: |
        Get a specific reagent by its ID.

        **Required Privilege:** `view_reagent`
      operationId: getReagentById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
      responses:
        '200':
          description: Reagent retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Get reagent successfully'
                  data:
                    $ref: '#/components/schemas/Reagent'
        '404':
          description: Reagent not found

    put:
      tags:
        - Reagents
      summary: Update reagent
      description: |
        Update a reagent by ID.

        **CAS Number:**
        - If updating CAS Number, it must be unique and in format: number-number-number (e.g., 7732-18-5)

        **Categories:**
        - A reagent can belong to multiple categories
        - Valid categories: Hematology, Biochemistry, Immunology, Molecular/PCR, Microbiology, Coagulation, Enzyme

        **Required Privilege:** `modify_reagent`
      operationId: updateReagent
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                catalogNumber:
                  type: string
                manufacturer:
                  type: string
                casNumber:
                  type: string
                  description: 'CAS Number in format: number-number-number (e.g., 7732-18-5). Must be unique.'
                description:
                  type: string
                usagePerRun:
                  type: object
                  properties:
                    min:
                      type: number
                    max:
                      type: number
                    unit:
                      type: string
                      enum: [ml, μL, L]
                ratio:
                  type: string
                categories:
                  type: array
                  description: 'Array of category names. Must be from predefined list: Hematology, Biochemistry, Immunology, Molecular/PCR, Microbiology, Coagulation, Enzyme'
                  items:
                    type: string
                    enum:
                      - Hematology
                      - Biochemistry
                      - Immunology
                      - 'Molecular/PCR'
                      - Microbiology
                      - Coagulation
                      - Enzyme
                storageCondition:
                  type: number
                  description: Storage temperature in degrees Celsius
                isActive:
                  type: boolean
      responses:
        '200':
          description: Reagent updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Reagent updated successfully'
                  data:
                    $ref: '#/components/schemas/Reagent'
        '400':
          description: |
            Bad request. Possible reasons:
            - Invalid categories (not from predefined list)
        '404':
          description: Reagent not found
        '409':
          description: |
            Conflict. Possible reasons:
            - Reagent with this name already exists
            - Reagent with this CAS Number already exists
        '422':
          description: Validation error

    delete:
      tags:
        - Reagents
      summary: Delete reagent
      description: |
        Delete a reagent from the system.

        **Required Privilege:** `delete_reagent`
      operationId: deleteReagent
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
      responses:
        '200':
          description: Reagent deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Reagent deleted successfully'
                  data:
                    $ref: '#/components/schemas/Reagent'
        '404':
          description: Reagent not found

  /reagents/categories:
    get:
      tags:
        - Reagents
      summary: Get reagent categories
      description: |
        Get the list of predefined reagent categories.

        **Available Categories:**
        - Hematology
        - Biochemistry
        - Immunology
        - Molecular/PCR
        - Microbiology
        - Coagulation
        - Enzyme

        **Required Privilege:** `view_reagent`
      operationId: getReagentCategories
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Reagent categories retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Get reagent categories successfully'
                  data:
                    type: array
