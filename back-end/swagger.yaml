          description: Patient record details retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Patient record details retrieved successfully'
                  data:
                    allOf:
                      - $ref: '#/components/schemas/PatientMedicalRecord'
                      - type: object
                        properties:
                          testOrders:
                            type: array
                            items:
                              allOf:
                                - $ref: '#/components/schemas/TestOrder'
                                - type: object
                                  properties:
                                    createdByUser:
                                      type: object
                                      properties:
                                        fullName:
                                          type: string
                                        email:
                                          type: string
                                    runByUser:
                                      type: object
                                      properties:
                                        fullName:
                                          type: string
                                        email:
                                          type: string
