  /reagents/inventory/fifo:
    get:
      tags:
        - Reagents
      summary: Get reagent inventory (FIFO)
      description: |
        Return reagent inventory aggregated by lot with FIFO sorting (earliest expiration first).

        Available quantity is calculated as `quantityReceived - quantityUsed` (summing Used/Consumed/Wasted for the same lot and unit).

        Recommended privilege: `view_reagent_supply_history`.
      operationId: getReagentInventoryFIFO
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Case-insensitive search across reagent name, vendor name, lot number, purchase order number, catalog number, and manufacturer.
        - name: reagentId
          in: query
          required: false
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
          description: Filter by reagent ID
        - name: reagentName
          in: query
          required: false
          schema:
            type: string
          description: Filter by reagent name (partial match)
        - name: vendorName
          in: query
          required: false
          schema:
            type: string
          description: Filter by vendor name (case-insensitive partial match)
        - name: includeExpired
          in: query
          required: false
          schema:
            type: boolean
          description: Include expired lots (default false)
        - name: includeExpiringSoon
          in: query
          required: false
          schema:
            type: boolean
          description: Only include lots expiring within 30 days (default false)
      responses:
        '200':
          description: Inventory retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Get reagent inventory successfully'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReagentInventoryItem'
        '401':
          description: Unauthorized

  /reagents/inventory/next-lot:
    get:
      tags:
        - Reagents
      summary: Get next reagent lot (FIFO)
      description: |
        Return the next lot to use based on FIFO (earliest expiration) that still has available quantity.

        If `requiredQuantity` is specified, returns the earliest lot that has at least that quantity available. Otherwise, returns the earliest expiring lot.

        Recommended privilege: `view_reagent_supply_history`.
      operationId: getNextReagentLotFIFO
      security:
        - bearerAuth: []
      parameters:
        - name: reagentId
          in: query
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
          description: Reagent ID
        - name: requiredQuantity
          in: query
          required: false
          schema:
            type: number
          description: Minimum quantity required (in the same unit as the lot)
      responses:
        '200':
          description: Next lot retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Get next reagent lot successfully'
                  data:
                    nullable: true
                    oneOf:
                      - $ref: '#/components/schemas/ReagentInventoryItem'
        '401':
          description: Unauthorized

