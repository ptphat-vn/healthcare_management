openapi: 3.0.4
info:
  title: Healthcare Management API
  description: |
    API documentation for Healthcare Management System

    This API provides endpoints for user authentication, user management, and healthcare-related operations.

    ## Authentication
    Most endpoints require authentication using JWT tokens. Include the token in the Authorization header:
    `Authorization: Bearer <your-token>`

    ## Role-Based Access Control (RBAC)
    The system uses a privilege-based authorization model where users are assigned roles with specific privileges.

    ### User Roles
    - `admin`: Administrator with full system access (privilege: `*`)
    - `lab_manager`: Lab Manager with management privileges
    - `service`: Service provider with operational privileges  
    - `lab_user`: Lab User with testing privileges
    - `patient`: Default user role with read-only access. Patients can only view their own medical records and test orders.

    ### Privileges
    The system supports granular privileges for different operations:

    **Role Management:**
    - `view_role`: View roles
    - `create_role`: Create new roles
    - `update_role`: Update existing roles
    - `delete_role`: Delete roles

    **Configuration Management:**
    - `view_config`: View configurations
    - `create_config`: Create configurations
    - `modify_config`: Modify configurations
    - `delete_config`: Delete configurations

    **User Management:**
    - `view_user`: View users
    - `modify_user`: Modify user information
    - `delete_user`: Delete users
    - `lock_unlock_user`: Lock/unlock user accounts

    **Comments:**
    - `add_comment`: Add comments
    - `modify_comment`: Modify comments
    - `delete_comment`: Delete comments

    **Test Orders:**
    - `create_test_order`: Create test orders
    - `delete_test_order`: Delete test orders
    - `review_test_order`: Review test orders
    - `modify_test_order`: Modify test orders

    **Blood Testing:**
    - `execute_blood_testing`: Execute blood testing procedures

    **Instruments:**
    - `view_instrument`: View instruments
    - `activate_instrument`: Activate instruments
    - `deactivate_instrument`: Deactivate instruments

    **Reagents:**
    - `view_reagent`: View reagents
    - `create_reagent`: Create reagents
    - `modify_reagent`: Modify reagents
    - `delete_reagent`: Delete reagents
    - `view_reagent_supply_history`: View reagent vendor supply history
    - `create_reagent_supply`: Create reagent vendor supply record
    - `view_reagent_usage_history`: View reagent usage history
    - `create_reagent_usage`: Record reagent usage

    **Event Logs:**
    - `view_event_logs`: View event logs

    **Basic Access:**
    - `read_only`: Basic read access
    - `*`: Admin privilege (access to everything)

    ## Authorization
    Each endpoint requires specific privileges. Users must have the required privileges to access the endpoint.
    Admin users (with `*` privilege) have access to all endpoints.
    
    **Patient Access Restrictions:**
    Users with the `patient` role have additional data access restrictions:
    - Can only view their own medical records (filtered automatically)
    - Can only view their own test orders and test results (filtered automatically)
    - Attempting to access another patient's data will result in a 403 Forbidden error

    ## User Status
    - `0`: Inactive (soft deleted)
    - `1`: Active
    - `2`: Locked
  version: 1.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3000/api
    description: Development server
tags:
  - name: Authentication
    description: User authentication and authorization
  - name: User Management
    description: User CRUD operations and management
  - name: Profile
    description: User profile operations
  - name: Roles
    description: Role management (create, update, list, delete)
  - name: Event Logs
    description: Event log management (list, get by id)
  - name: Test Orders
    description: Test order management operations
  - name: Patient Medical Records
    description: Patient medical record management operations
  - name: Test Results
    description: Test results processing and management
  - name: Test Order Review
    description: Manual and AI review operations
  - name: Comments
    description: Comment management operations
  - name: Flagging Configuration
    description: Flagging configuration management
  - name: Reagents
    description: Reagent management operations (CRUD, vendor supply history, usage history)
  - name: Chat
    description: Real-time chat and conversation history between patients and clinicians
  - name: Notifications
    description: Chat Notification

paths:
  /roles:
    get:
      tags:
        - Roles
      summary: List roles
      description: |
        Get a paginated list of roles.

        **Required Privilege:** `view_role`

        **Access:** Admin, Lab Manager, Service
      operationId: listRoles
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
            enum: [name, code, createdAt]
        - name: sortOrder
          in: query
          required: false
          schema:
            type: integer
            enum: [1, -1]
            example: 1
        - name: page
          in: query
          required: false
          schema:
            type: integer
            example: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            example: 10
      responses:
        '200':
          description: Roles retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Get roles successfully'
                  data:
                    type: object
                    properties:
                      role:
                        type: array
                        items:
                          $ref: '#/components/schemas/Role'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '403':
          description: Insufficient privileges
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Bạn không có quyền thực hiện hành động này'
                  required:
                    type: array
                    items:
                      type: string
                    example: ['view_role']
                  current:
                    type: array
                    items:
                      type: string
                    example: ['read_only']

    post:
      tags:
        - Roles
      summary: Create role
      description: |
        Create a new role with specified privileges.

        **Required Privilege:** `create_role`

        **Access:** Admin, Lab Manager
      operationId: createRole
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - code
              properties:
                name:
                  type: string
                  example: 'Lab Manager'
                code:
                  type: string
                  example: 'lab_manager'
                description:
                  type: string
                  example: 'Manage lab and users'
                privileges:
                  type: array
                  items:
                    type: string
                  example:
                    [
                      'view_role',
                      'create_role',
                      'update_role',
                      'view_config',
                      'create_config',
                      'modify_config',
                      'delete_config',
                      'view_user',
                      'modify_user',
                      'delete_user',
                      'lock_unlock_user',
                      'add_comment',
                      'modify_comment',
                      'delete_comment',
                      'review_test_order',
                      'modify_test_order'
                    ]
      responses:
        '201':
          description: Role created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Role created successfully'
                  data:
                    $ref: '#/components/schemas/Role'
        '403':
          description: Insufficient privileges
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Bạn không có quyền thực hiện hành động này'
                  required:
                    type: array
                    items:
                      type: string
                    example: ['create_role']
                  current:
                    type: array
                    items:
                      type: string
                    example: ['read_only']
        '409':
          description: Role code already exists
        '422':
          description: Validation error

  /roles/{id}:
    put:
      tags:
        - Roles
      summary: Update role
      description: Update a role by id
      operationId: updateRole
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                privileges:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Role updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Role updated successfully'
                  data:
                    $ref: '#/components/schemas/Role'
        '404':
          description: Role not found
        '422':
          description: Validation error

    delete:
      tags:
        - Roles
      summary: Delete role
      description: Delete a role from role collection
      operationId: deleteRole
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Role ID
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
      responses:
        '200':
          description: Role deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Role deleted successfully'
                  data:
                    $ref: '#/components/schemas/Role'
        '400':
          description: Invalid role id
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Role not found
        '422':
          description: Validation error
  # Authentication endpoints
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      description: Create a new user account
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fullName
                - email
                - phoneNumber
                - identifyNumber
                - gender
                - dateOfBirth
                - password
              properties:
                fullName:
                  type: string
                  example: 'Nguyễn Văn A'
                email:
                  type: string
                  format: email
                  example: 'user@example.com'
                phoneNumber:
                  type: string
                  pattern: '^[0-9]{10,11}$'
                  example: '0123456789'
                identifyNumber:
                  type: string
                  pattern: '^[0-9]{9,12}$'
                  example: '123456789'
                gender:
                  type: string
                  enum: [male, female]
                  example: 'male'
                address:
                  type: string
                  example: '123 Main Street, City'
                dateOfBirth:
                  type: string
                  format: date
                  example: '1990-01-01'
                password:
                  type: string
                  minLength: 8
                  example: 'password123'
      responses:
        '200':
          description: Registration successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Đăng ký thành công'
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: '507f1f77bcf86cd799439011'
                      fullName:
                        type: string
                        example: 'Nguyễn Văn A'
                      email:
                        type: string
                        example: 'user@example.com'
                      phoneNumber:
                        type: string
                        example: '0123456789'
                      identifyNumber:
                        type: string
                        example: '123456789'
                      gender:
                        type: string
                        example: 'male'
                      address:
                        type: string
                        example: '123 Main Street, City'
                      dateOfBirth:
                        type: string
                        example: '1990-01-01'
                      role:
                        type: string
                        example: 'user'
        '409':
          description: Conflict - Email, phone, or identify number already exists
        '422':
          description: Validation error

  /auth/login:
    post:
      tags:
        - Authentication
      summary: User login
      description: Authenticate user and return JWT tokens
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: 'ncb2601@gmail.com'
                password:
                  type: string
                  example: '12345678'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Đăng nhập thành công'
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                        example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
                      refreshToken:
                        type: string
                        example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Thông tin đăng nhập không hợp lệ'
        '403':
          description: Account inactive or locked
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Tài khoản đã bị vô hiệu hóa'
        '422':
          description: Validation error
  /auth/login-google:
    post:
      tags:
        - Authentication
      summary: Login with Google OAuth
      description: |
        Authenticate user using Google OAuth token.  
        Returns JWT accessToken and refreshToken if successful.
      operationId: loginGoogle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tokenGoogle
              properties:
                tokenGoogle:
                  type: string
                  description: Google OAuth ID token
                  example: 'eyJhbGciOiJSUzI1NiIsImtpZCI6Ij...'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Đăng nhập thành công'
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                        example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
                      refreshToken:
                        type: string
                        example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        '400':
          description: Missing or invalid Google token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid Google token or user not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Account inactive or locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/logout:
    post:
      tags:
        - Authentication
      summary: User logout
      description: Clear user session
      operationId: logout
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Đăng xuất thành công'
                  data:
                    type: object
                    properties:
                      sessionCleared:
                        type: boolean
                        example: true

  /auth/forgot-password:
    post:
      tags:
        - Authentication
      summary: Request password reset
      description: Send OTP via email for password reset
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: 'user@example.com'
      responses:
        '200':
          description: OTP sent to email
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'OTP đã được gửi tới email của bạn!'
                  data:
                    type: object
                    properties:
                      email:
                        type: string
                        example: 'user@example.com'
        '404':
          description: Email not found
        '422':
          description: Validation error

  /auth/reset-password:
    post:
      tags:
        - Authentication
      summary: Reset password
      description: Reset password using OTP
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - otp
                - newPassword
              properties:
                email:
                  type: string
                  example: 'user@example.com'
                otp:
                  type: string
                  example: '123456'
                newPassword:
                  type: string
                  minLength: 8
                  example: 'newpassword123'
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Mật khẩu đã được đặt lại thành công'
                  data:
                    type: object
                    properties:
                      email:
                        type: string
                        example: 'user@example.com'
        '400':
          description: Invalid or expired OTP
        '422':
          description: Validation error

  /auth/change-password:
    post:
      tags:
        - Authentication
      summary: Change password
      description: Change user password (requires authentication)
      operationId: changePassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - oldPassword
                - newPassword
              properties:
                oldPassword:
                  type: string
                  example: 'oldpassword123'
                newPassword:
                  type: string
                  minLength: 8
                  example: 'newpassword123'
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Password changed successfully'
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                        example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
                      refreshToken:
                        type: string
                        example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        '400':
          description: Invalid old password or same password
        '401':
          description: Unauthorized

  /event-logs:
    get:
      tags:
        - Event Logs
      summary: List event logs
      description: Retrieve a paginated list of event logs with optional filters
      operationId: listEventLogs
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: action
          in: query
          required: false
          schema:
            type: string
        - name: operatorName
          in: query
          required: false
          schema:
            type: string
        - name: operatorRole
          in: query
          required: false
          schema:
            type: string
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
            enum: [timestamp, action]
        - name: sortOrder
          in: query
          required: false
          schema:
            type: integer
            enum: [1, -1]
            example: -1
        - name: page
          in: query
          required: false
          schema:
            type: integer
            example: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            example: 20
      responses:
        '200':
          description: Event logs retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Event logs retrieved'
                  data:
                    type: object
                    properties:
                      eventLogs:
                        type: array
                        items:
                          $ref: '#/components/schemas/EventLog'
                      pagination:
                        type: object
                        properties:
                          page:
                            type: integer
                          limit:
                            type: integer
                          total:
                            type: integer
                          totalPages:
                            type: integer

  /event-logs/{id}:
    get:
      tags:
        - Event Logs
      summary: Get event log by id
      description: Retrieve a single event log by its id
      operationId: getEventLogById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
      responses:
        '200':
          description: Event log retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Event log retrieved'
                  data:
                    $ref: '#/components/schemas/EventLog'
        '400':
          description: Invalid id
        '401':
          description: Unauthorized
        '404':
          description: Event log not found
        '422':
          description: Validation error

  /auth/refresh-token:
    post:
      tags:
        - Authentication
      summary: Refresh access token
      description: Get new access token using refresh token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Token refreshed successfully'
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                        example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        '401':
          description: Invalid refresh token
        '422':
          description: Validation error

  /auth/me:
    get:
      tags:
        - Profile
      summary: Get current user profile
      description: Get authenticated user's profile information
      operationId: getProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Lấy thông tin người dùng thành công'
                  data:
                    allOf:
                      - $ref: '#/components/schemas/User'
                      - type: object
                        properties:
                          roleCode:
                            type: string
                            example: 'admin'
                          roleName:
                            type: string
                            example: 'Administrator'
        '401':
          description: Unauthorized
        '404':
          description: User not found

  # Admin endpoints
  /admin/create-user:
    post:
      tags:
        - User Management
      summary: Create user (Admin only)
      description: Create a new user account (admin operation). After creation, the system sends an email to the user's address containing their login credentials (email and the password set by admin). Users should change their password on first login.
      operationId: createUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fullName
                - email
                - phoneNumber
                - identifyNumber
                - gender
                - dateOfBirth
                - password
              properties:
                fullName:
                  type: string
                  example: 'Nguyễn Văn B'
                email:
                  type: string
                  format: email
                  example: 'admin@example.com'
                phoneNumber:
                  type: string
                  pattern: '^[0-9]{10,11}$'
                  example: '0987654321'
                identifyNumber:
                  type: string
                  pattern: '^[0-9]{9,12}$'
                  example: '987654321'
                gender:
                  type: string
                  enum: [male, female]
                  example: 'female'
                address:
                  type: string
                  example: '456 Oak Street, City'
                dateOfBirth:
                  type: string
                  format: date
                  example: '1985-05-15'
                password:
                  type: string
                  minLength: 8
                  example: 'password123'
      responses:
        '200':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Đăng ký thành công'
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: '507f1f77bcf86cd799439012'
                      fullName:
                        type: string
                        example: 'Nguyễn Văn B'
                      email:
                        type: string
                        example: 'admin@example.com'
                      phoneNumber:
                        type: string
                        example: '0987654321'
                      identifyNumber:
                        type: string
                        example: '987654321'
                      gender:
                        type: string
                        example: 'female'
                      address:
                        type: string
                        example: '456 Oak Street, City'
                      dateOfBirth:
                        type: string
                        example: '1985-05-15'
        '409':
          description: Conflict - Email, phone, or identify number already exists
        '422':
          description: Validation error

  /admin/users/update/{id}:
