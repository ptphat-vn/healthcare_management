          type: string
          example: '507f1f77bcf86cd799439011'
        action:
          type: string
          example: 'USER_UPDATED'
        details:
          type: string
          example: 'Updated user profile information'
        timestamp:
          type: string
          format: date-time
          example: '2024-01-15T10:30:00Z'

    TestOrder:
      type: object
