  # Test Order Management
  /test-orders:
    post:
      tags:
        - Test Orders
      summary: Create a new test order
      description: Create a new patient test order with required information
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - medicalRecordId
                - requestedTests
              properties:
                medicalRecordId:
                  type: string
                  description: MongoDB ObjectId of the existing medical record
                  example: '6512bd43d9caa6e02c990b0a'
                requestedTests:
                  type: array
                  description: Select one or more tests to perform for this order (CBC panel)
                  items:
                    type: string
                    enum:
                      - 'White Blood Cell Count'
                      - 'Red Blood Cell Count'
                      - 'Hemoglobin'
                      - 'Hematocrit'
                      - 'Platelet Count'
                      - 'Mean Corpuscular Volume'
                      - 'Mean Corpuscular Haemoglobin'
                      - 'Mean Corpuscular Haemoglobin Concentration'
                  example: ['Hemoglobin', 'Hematocrit', 'Platelet Count']
      responses:
        '201':
          description: Test order created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Tạo đơn xét nghiệm thành công'
                  data:
                    $ref: '#/components/schemas/TestOrder'
        '400':
          description: Validation error
        '401':
          description: Unauthorized

    get:
      tags:
        - Test Orders
      summary: Get list of test orders
      description: |
        Retrieve a paginated list of test orders with search and filter options.
        
        **Patient Access Restriction:** Users with role `patient` can only view their own test orders and test results. 
        The system automatically filters results to show only test orders associated with the authenticated patient's medical records.
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          description: Search by patient name, phone, or email
          schema:
            type: string
          example: 'Nguyễn'
        - name: status
          in: query
          description: Filter by test order status
          schema:
            type: string
            enum: [pending, cancelled, completed, reviewed, ai_reviewed]
          example: 'completed'
        - name: sortBy
          in: query
          description: Sort field
          schema:
            type: string
            enum: [patientName, createdDate, runDate, status]
          example: 'createdDate'
        - name: sortOrder
          in: query
          description: Sort order (1 for ascending, -1 for descending)
          schema:
            type: integer
            enum: [1, -1]
          example: -1
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            minimum: 1
          example: 1
        - name: limit
          in: query
          description: Items per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
          example: 10
      responses:
        '200':
          description: Test orders retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Lấy danh sách đơn xét nghiệm thành công'
                  data:
                    type: object
                    properties:
                      testOrder:
                        type: array
                        items:
                          $ref: '#/components/schemas/TestOrder'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Patient users can only access their own test orders

  /test-orders/{id}:
    get:
      tags:
        - Test Orders
      summary: Get test order details
      description: |
        Retrieve detailed information of a specific test order, including test results.
        
        **Patient Access Restriction:** Users with role `patient` can only view test order details (including test results) 
        that belong to their own medical records. Attempting to access another patient's test order will result in a 403 Forbidden error.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Test order ID
          schema:
            type: string
            example: '507f1f77bcf86cd799439011'
      responses:
        '200':
          description: Test order details retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Lấy chi tiết đơn xét nghiệm thành công'
                  data:
                    $ref: '#/components/schemas/TestOrderDetail'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Patient users can only access their own test orders
        '404':
          description: Test order not found

    put:
      tags:
        - Test Orders
      summary: Update test order
      description: Update patient information in a test order
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Test order ID
          schema:
            type: string
            example: '507f1f77bcf86cd799439011'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                patientName:
                  type: string
                  example: 'Nguyễn Văn A'
                dateOfBirth:
                  type: string
                  format: date
                  example: '1990-01-15'
                gender:
                  type: string
                  enum: [male, female]
                  example: 'male'
                address:
                  type: string
                  example: '123 Đường ABC, Quận 1, TP.HCM'
                phoneNumber:
                  type: string
                  pattern: '^[0-9]{10,11}$'
                  example: '0123456789'
                email:
                  type: string
                  format: email
                  example: 'patient@email.com'
      responses:
        '200':
          description: Test order updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Cập nhật đơn xét nghiệm thành công'
                  data:
                    $ref: '#/components/schemas/TestOrder'
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '404':
          description: Test order not found

    delete:
      tags:
        - Test Orders
      summary: Delete test order
      description: Delete a test order (soft delete)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Test order ID
          schema:
            type: string
            example: '507f1f77bcf86cd799439011'
      responses:
        '200':
          description: Test order deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Xóa đơn xét nghiệm thành công'
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: 'Test order deleted successfully'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (insufficient role)
        '404':
          description: Test order not found

