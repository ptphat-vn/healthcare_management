                      type: string
                    example:
                      - Hematology
                      - Biochemistry
                      - Immunology
                      - 'Molecular/PCR'
                      - Microbiology
                      - Coagulation
                      - Enzyme

  /reagents/vendor-supply:
    post:
      tags:
        - Reagents
      summary: Create vendor supply record
      description: |
        Record a new reagent shipment received from a vendor. This automatically creates an entry in the vendor supply history.

        **Note:** If `reagentName`, `catalogNumber`, `manufacturer`, or `casNumber` are not provided, they will be automatically retrieved from the reagent record based on `reagentId`.

        **Required Privilege:** `create_reagent_supply`
      operationId: createVendorSupply
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reagentId
                - vendorName
                - purchaseOrderNumber
                - orderDate
                - receiptDate
                - quantityReceived
                - unitOfMeasure
                - lotNumber
                - expirationDate
                - receivedBy
                - status
              properties:
                reagentId:
                  type: string
                  pattern: '^[0-9a-fA-F]{24}$'
                  description: Reagent ID. Required. If other reagent fields are not provided, they will be auto-filled from this reagent.
                  example: '507f1f77bcf86cd799439011'
                reagentName:
                  type: string
                  description: Reagent name. Optional. If not provided, will be auto-filled from reagent record.
                  example: 'Diluent'
                catalogNumber:
                  type: string
                  description: Catalog number. Optional. If not provided, will be auto-filled from reagent record.
                  example: 'CAT-001'
                manufacturer:
                  type: string
                  description: Manufacturer name. Optional. If not provided, will be auto-filled from reagent record.
                  example: 'ABC Chemicals'
                casNumber:
                  type: string
                  description: CAS Number. Optional. If not provided, will be auto-filled from reagent record.
                  example: '123-45-6'
                vendorName:
                  type: string
                  example: 'XYZ Supplies Inc.'
                vendorId:
                  type: string
                  example: 'VEND-001'
                purchaseOrderNumber:
                  type: string
                  example: 'PO-2024-001'
                orderDate:
                  type: string
                  format: date
                  example: '2024-01-15'
                receiptDate:
                  type: string
                  format: date
                  example: '2024-01-20'
                quantityReceived:
                  type: number
                  example: 100
                unitOfMeasure:
                  type: string
                  example: 'ml'
                lotNumber:
                  type: string
                  description: |
                    Lot number for this reagent shipment. **Must be unique for each reagent.**
                    The same lot number cannot be used twice for the same reagent, but can be used for different reagents.
                  example: 'LOT-2024-001'
                expirationDate:
                  type: string
                  format: date
                  example: '2025-12-31'
                receivedBy:
                  type: string
                  pattern: '^[0-9a-fA-F]{24}$'
                  example: '507f1f77bcf86cd799439011'
                initialStorageLocation:
                  type: string
                  example: 'Warehouse A, Shelf 3'
                status:
                  type: string
                  enum: [Received, Partial Shipment, Returned]
                  example: 'Received'
      responses:
        '200':
          description: Vendor supply record created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Vendor supply record created successfully'
                  data:
                    $ref: '#/components/schemas/ReagentVendorSupply'
        '404':
          description: Reagent or user not found
        '409':
          description: Conflict - Lot number already exists for this reagent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Lot number "LOT-2024-001" already exists for this reagent. Each reagent must have unique lot numbers.'
        '422':
          description: Validation error

  /reagents/vendor-supply/history:
    get:
      tags:
        - Reagents
      summary: List vendor supply history
      description: |
        Get a paginated list of reagent vendor supply history. Can filter by reagent name, vendor name, or date range.
        **Required Privilege:** `view_reagent_supply_history`

        If no filters are provided, returns the full history of all reagent shipments.
      operationId: listVendorSupplyHistory
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Case-insensitive search across reagent name, vendor name, lot number, purchase order number, catalog number, and manufacturer.
        - name: reagentName
          in: query
          required: false
          schema:
            type: string
          description: Filter by reagent name (case-insensitive partial match)
        - name: vendorName
          in: query
          required: false
          schema:
            type: string
          description: Filter by vendor name (case-insensitive partial match)
        - name: startDate
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Filter by receipt date from (YYYY-MM-DD)
        - name: endDate
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Filter by receipt date to (YYYY-MM-DD)
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
            enum: [receiptDate, orderDate, createdAt]
            default: receiptDate
        - name: sortOrder
          in: query
          required: false
          schema:
            type: integer
            enum: [1, -1]
            default: -1
      responses:
        '200':
          description: Vendor supply history retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Get vendor supply history successfully'
                  data:
                    type: object
                    properties:
                      vendorSupplies:
                        type: array
                        items:
                          $ref: '#/components/schemas/ReagentVendorSupply'
                      pagination:
                        $ref: '#/components/schemas/Pagination'

  /reagents/usage/history:
