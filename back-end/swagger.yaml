  /test-orders/{id}/ai-review:
    post:
      tags:
        - Test Order Review
      summary: AI auto review a completed test order
      description: |
        Trigger AI-assisted review on a completed test order. The system evaluates results, applies minor adjustments if appropriate, clamps values within configured acceptable ranges, and updates status to `ai_reviewed`.

        Required privilege: `review_test_order`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Test order ID
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
      responses:
        '200':
          description: AI review completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'AI review completed successfully'
                  data:
                    type: object
                    properties:
                      testOrder:
                        $ref: '#/components/schemas/TestOrder'
                      aiSuggestions:
                        type: array
                        description: Raw AI suggestion items returned by Gemini
                        items:
                          type: object
                          properties:
                            testName:
                              type: string
                              example: 'Glucose'
                            suggestedResult:
                              type: number
                              example: 101.5
                      aiDiagnosis:
                        type: string
                        nullable: true
                        description: JSON string of AI diagnoses (diagnoses[], notes)
                        example: '{"diagnoses":[{"name":"Diabetes Mellitus","confidence":0.72,"rationale":"Elevated fasting glucose"}],"notes":"Suggest confirmatory testing"}'
        '400':
          description: Bad request (invalid id, insufficient data, or wrong status)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Test order must be completed before AI review'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - missing privilege `review_test_order`
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Bạn không có quyền thực hiện hành động này'
                  required:
                    type: array
                    items:
                      type: string
                    example: ['review_test_order']
        '404':
          description: Test order not found

  /ai/diagnostics:
    get:
      tags:
        - Test Order Review
      summary: Ping Gemini AI to verify API key and model reachability
      description: Calls the configured Gemini model with a trivial prompt and returns a short text sample
