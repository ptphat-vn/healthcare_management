openapi: 3.0.4
info:
  title: Healthcare Management API
  description: |
    API documentation for Healthcare Management System

    This API provides endpoints for user authentication, user management, test order management, and healthcare-related operations.

    ## Authentication
    Most endpoints require authentication using JWT tokens. Include the token in the Authorization header:

    ## User Roles
    - `admin`: Full system access
    - `manager`: Management access
    - `user`: Basic user access
    - `service`: Service provider access
    - `consultant`: Consultant access
    - `lab_technician`: Laboratory technician access

    ## User Status
    - `0`: Inactive (soft deleted)
    - `1`: Active
    - `2`: Locked

    ## Test Order Status
    - `pending`: Test order created, waiting for processing
    - `cancelled`: Test order cancelled
    - `completed`: Test results available
    - `reviewed`: Manually reviewed by staff
    - `ai_reviewed`: Reviewed by AI system

    ## Test Result Status
    - `normal`: Within normal range
    - `abnormal`: Outside normal range
    - `critical`: Critical values requiring immediate attention
  version: 1.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3000/api
    description: Development server
tags:
  - name: Authentication
    description: User authentication and authorization
  - name: User Management
    description: User CRUD operations and management
  - name: Profile
    description: User profile operations
  - name: Roles
    description: Role management (create, update, list)
  - name: Test Orders
    description: Test order management operations
  - name: Patient Medical Records
    description: Patient medical record management operations
  - name: Test Results
    description: Test results processing and management
  - name: Test Order Review
    description: Manual and AI review operations
  - name: Comments
    description: Comment management operations
  - name: Flagging Configuration
    description: Flagging configuration management

paths:
  /roles:
    get:
      tags:
        - Roles
      summary: List roles
      description: Get a paginated list of roles
      operationId: listRoles
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
            enum: [name, code, createdAt]
        - name: sortOrder
          in: query
          required: false
          schema:
            type: integer
            enum: [1, -1]
            example: 1
        - name: page
          in: query
          required: false
          schema:
            type: integer
            example: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            example: 10
      responses:
        '200':
          description: Roles retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Get roles successfully'
                  data:
                    type: object
                    properties:
                      role:
                        type: array
                        items:
                          $ref: '#/components/schemas/Role'
                      pagination:
                        $ref: '#/components/schemas/Pagination'

    post:
      tags:
        - Roles
      summary: Create role
      description: Create a new role
      operationId: createRole
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - code
              properties:
                name:
                  type: string
                  example: 'Laboratory Manager'
                code:
                  type: string
                  example: 'manager'
                description:
                  type: string
                privileges:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Role created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Role created successfully'
                  data:
                    $ref: '#/components/schemas/Role'
        '409':
          description: Role code already exists
        '422':
          description: Validation error

  /roles/{id}:
    put:
      tags:
        - Roles
      summary: Update role
      description: Update a role by id
      operationId: updateRole
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                privileges:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Role updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Role updated successfully'
                  data:
                    $ref: '#/components/schemas/Role'
        '404':
          description: Role not found
        '422':
          description: Validation error

    delete:
      tags:
        - Roles
      summary: Delete role
      description: Delete a role from role collection
      operationId: deleteRole
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Role ID
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
      responses:
        '200':
          description: Role deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Role deleted successfully'
                  data:
                    $ref: '#/components/schemas/Role'
        '400':
          description: Invalid role id
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Role not found
        '422':
          description: Validation error
  # Authentication endpoints
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      description: Create a new user account
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fullName
                - email
                - phoneNumber
                - identifyNumber
                - gender
                - dateOfBirth
                - password
              properties:
                fullName:
                  type: string
                  example: 'Nguyễn Văn A'
                email:
                  type: string
                  format: email
                  example: 'user@example.com'
                phoneNumber:
                  type: string
                  pattern: '^[0-9]{10,11}$'
                  example: '0123456789'
                identifyNumber:
                  type: string
                  pattern: '^[0-9]{9,12}$'
                  example: '123456789'
                gender:
                  type: string
                  enum: [male, female]
                  example: 'male'
                address:
                  type: string
                  example: '123 Main Street, City'
                dateOfBirth:
                  type: string
                  format: date
                  example: '1990-01-01'
                password:
                  type: string
                  minLength: 8
                  example: 'password123'
      responses:
        '200':
          description: Registration successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Đăng ký thành công'
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: '507f1f77bcf86cd799439011'
                      fullName:
                        type: string
                        example: 'Nguyễn Văn A'
                      email:
                        type: string
                        example: 'user@example.com'
                      phoneNumber:
                        type: string
                        example: '0123456789'
                      identifyNumber:
                        type: string
                        example: '123456789'
                      gender:
                        type: string
                        example: 'male'
                      address:
                        type: string
                        example: '123 Main Street, City'
                      dateOfBirth:
                        type: string
                        example: '1990-01-01'
                      role:
                        type: string
                        example: 'user'
        '409':
          description: Conflict - Email, phone, or identify number already exists
        '422':
          description: Validation error

  /auth/login:
    post:
      tags:
        - Authentication
      summary: User login
      description: Authenticate user and return JWT tokens
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: 'user@example.com'
                password:
                  type: string
                  example: 'password123'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Đăng nhập thành công'
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                        example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
                      refreshToken:
                        type: string
                        example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        '401':
          description: Invalid credentials
        '422':
          description: Validation error

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: User logout
      description: Clear user session
      operationId: logout
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Đăng xuất thành công'
                  data:
                    type: object
                    properties:
                      sessionCleared:
                        type: boolean
                        example: true

  /auth/forgot-password:
    post:
      tags:
        - Authentication
      summary: Request password reset
      description: Send password reset email
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: 'user@example.com'
      responses:
        '200':
          description: Password reset email sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Email đặt lại mật khẩu đã được gửi đến địa chỉ email của bạn'
                  data:
                    type: object
                    properties:
                      email:
                        type: string
                        example: 'user@example.com'
        '404':
          description: Email not found
        '422':
          description: Validation error

  /auth/reset-password:
    post:
      tags:
        - Authentication
      summary: Reset password
      description: Reset password using token
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - newPassword
              properties:
                token:
                  type: string
                  example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
                newPassword:
                  type: string
                  minLength: 8
                  example: 'newpassword123'
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Mật khẩu đã được đặt lại thành công'
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                        example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
                      refreshToken:
                        type: string
                        example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        '400':
          description: Invalid or expired token
        '422':
          description: Validation error

  /auth/change-password:
    post:
      tags:
        - Authentication
      summary: Change password
      description: Change user password (requires authentication)
      operationId: changePassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - oldPassword
                - newPassword
              properties:
                oldPassword:
                  type: string
                  example: 'oldpassword123'
                newPassword:
                  type: string
                  minLength: 8
                  example: 'newpassword123'
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Password changed successfully'
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                        example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
                      refreshToken:
                        type: string
                        example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        '400':
          description: Invalid old password or same password
        '401':
          description: Unauthorized
        '422':
          description: Validation error

  /auth/refresh-token:
    post:
      tags:
        - Authentication
      summary: Refresh access token
      description: Get new access token using refresh token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Token refreshed successfully'
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                        example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        '401':
          description: Invalid refresh token
        '422':
          description: Validation error

  /auth/me:
    get:
      tags:
        - Profile
      summary: Get current user profile
      description: Get authenticated user's profile information
      operationId: getProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Lấy thông tin người dùng thành công'
                  data:
                    allOf:
                      - $ref: '#/components/schemas/User'
                      - type: object
                        properties:
                          roleCode:
                            type: string
                            example: 'admin'
                          roleName:
                            type: string
                            example: 'Administrator'
        '401':
          description: Unauthorized
        '404':
          description: User not found

  # Admin endpoints
  /admin/create-user:
    post:
      tags:
        - User Management
      summary: Create user (Admin only)
      description: Create a new user account (admin operation)
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fullName
                - email
                - phoneNumber
                - identifyNumber
                - gender
                - dateOfBirth
                - password
              properties:
                fullName:
                  type: string
                  example: 'Nguyễn Văn B'
                email:
                  type: string
                  format: email
                  example: 'admin@example.com'
                phoneNumber:
                  type: string
                  pattern: '^[0-9]{10,11}$'
                  example: '0987654321'
                identifyNumber:
                  type: string
                  pattern: '^[0-9]{9,12}$'
                  example: '987654321'
                gender:
                  type: string
                  enum: [male, female]
                  example: 'female'
                address:
                  type: string
                  example: '456 Oak Street, City'
                dateOfBirth:
                  type: string
                  format: date
                  example: '1985-05-15'
                password:
                  type: string
                  minLength: 8
                  example: 'password123'
      responses:
        '200':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Đăng ký thành công'
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: '507f1f77bcf86cd799439012'
                      fullName:
                        type: string
                        example: 'Nguyễn Văn B'
                      email:
                        type: string
                        example: 'admin@example.com'
                      phoneNumber:
                        type: string
                        example: '0987654321'
                      identifyNumber:
                        type: string
                        example: '987654321'
                      gender:
                        type: string
                        example: 'female'
                      address:
                        type: string
                        example: '456 Oak Street, City'
                      dateOfBirth:
                        type: string
                        example: '1985-05-15'
        '409':
          description: Conflict - Email, phone, or identify number already exists
        '422':
          description: Validation error

  /admin/users/update/{id}:
    put:
      tags:
        - User Management
      summary: Update user
      description: Update user information (requires authentication)
      operationId: updateUser
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: User ID
          schema:
            type: string
            example: '507f1f77bcf86cd799439011'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                  example: 'Nguyễn Văn A Updated'
                dateOfBirth:
                  type: string
                  format: date
                  example: '1990-01-01'
                gender:
                  type: string
                  enum: [male, female]
                  example: 'male'
                address:
                  type: string
                  example: '123 Updated Street, City'
                email:
                  type: string
                  format: email
                  example: 'updated@example.com'
                phoneNumber:
                  type: string
                  pattern: '^[0-9]{10,11}$'
                  example: '0123456789'
                roleId:
                  type: string
                  description: Role ID to assign to the user
                  example: '507f1f77bcf86cd799439099'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'User updated successfully'
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          description: Invalid user ID or role ID
        '401':
          description: Unauthorized
        '404':
          description: User not found or role not found
        '409':
          description: Email or phone number already exists
        '422':
          description: Validation error

  /admin/users/{id}/status:
    patch:
      tags:
        - User Management
      summary: Update user status
      description: Update user status (active/inactive/locked)
      operationId: updateUserStatus
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: User ID
          schema:
            type: string
            example: '507f1f77bcf86cd799439011'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: integer
                  enum: [0, 1, 2]
                  description: |
                    0 - Inactive (soft deleted)
                    1 - Active
                    2 - Locked
                  example: 1
      responses:
        '200':
          description: User status updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'User status updated'
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          description: Invalid user ID or status
        '401':
          description: Unauthorized
        '404':
          description: User not found
        '422':
          description: Validation error
  /admin/users/delete/{id}:
    delete:
      tags:
        - User Management
      summary: Delete user
      description: Soft delete a user by setting status to inactive (status=0)
      operationId: deleteUser
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: User ID
          schema:
            type: string
            example: '507f1f77bcf86cd799439011'
      responses:
        '200':
          description: User deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'User deleted (status=0)'
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          description: Invalid user ID
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Insufficient permissions
        '404':
          description: User not found

  /admin/users/block/{id}:
    post:
      tags:
        - User Management
      summary: Block user
      description: Block a user by setting status to locked (status=2)
      operationId: blockUser
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: User ID
          schema:
            type: string
            example: '507f1f77bcf86cd799439011'
      responses:
        '200':
          description: User blocked successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'User blocked successfully'
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          description: Invalid user ID
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Insufficient permissions
        '404':
          description: User not found

  # User endpoints
  /user/all:
    get:
      tags:
        - User Management
      summary: List users with pagination and search
      description: Retrieve paginated list of users with search, filter, and sorting capabilities
      operationId: getAllUsers
      parameters:
        - name: search
          in: query
          required: false
          description: Search term for email, fullName, or phoneNumber
          schema:
            type: string
            example: 'john'
        - name: status
          in: query
          required: false
          description: Filter by user status
          schema:
            type: integer
            enum: [0, 1, 2]
            example: 1
        - name: sortBy
          in: query
          required: false
          description: Sort field
          schema:
            type: string
            enum: [fullName, email, createdAt, updatedAt]
            example: 'createdAt'
        - name: sortOrder
          in: query
          required: false
          description: Sort order
          schema:
            type: integer
            enum: [1, -1]
            example: -1
        - name: page
          in: query
          required: false
          description: Page number for pagination
          schema:
            type: integer
            minimum: 1
            example: 1
        - name: limit
          in: query
          required: false
          description: Number of items per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            example: 10
      responses:
        '200':
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Lấy danh sách người dùng thành công'
                  data:
                    type: object
                    properties:
                      user:
                        type: array
                        items:
                          allOf:
                            - $ref: '#/components/schemas/User'
                            - type: object
                              properties:
                                roleCode:
                                  type: string
                                  example: 'user'
                                roleName:
                                  type: string
                                  example: 'Normal user'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '404':
          description: No users found

  /user/{id}:
    get:
      tags:
        - User Management
      summary: Get user by ID
      description: Retrieve user information by ID
      operationId: getUserById
      parameters:
        - name: id
          in: path
          required: true
          description: User ID
          schema:
            type: string
            example: '507f1f77bcf86cd799439011'
      responses:
        '200':
          description: User retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Lấy thông tin người dùng thành công'
                  data:
                    $ref: '#/components/schemas/User'
        '404':
          description: User not found

  /user/profile:
    put:
      tags:
        - Profile
      summary: Update user profile
      description: Update authenticated user's profile information
      operationId: updateUserProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                  example: 'Nguyễn Văn A Updated'
                dateOfBirth:
                  type: string
                  format: date
                  example: '1990-01-01'
                gender:
                  type: string
                  enum: [male, female]
                  example: 'male'
                address:
                  type: string
                  example: '123 Updated Street, City'
                email:
                  type: string
                  format: email
                  example: 'updated@example.com'
                phoneNumber:
                  type: string
                  pattern: '^[0-9]{10,11}$'
                  example: '0123456789'
      responses:
