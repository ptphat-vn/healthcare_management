version: '3.8'

services:
  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: healthcare_backend
    restart: always
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=${MONGODB_URI}
      - MONGO_DB_NAME=${MONGO_DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
      - FRONTEND_URLS=${FRONTEND_URLS}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - CLOUDINARY_NAME=${CLOUDINARY_NAME}
      - CLOUDINARY_KEY=${CLOUDINARY_KEY}
      - CLOUDINARY_SECRET=${CLOUDINARY_SECRET}
      - STRINGEE_API_KEY_SID=${STRINGEE_API_KEY_SID}
      - STRINGEE_API_KEY_SECRET=${STRINGEE_API_KEY_SECRET}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE}
      - UPLOAD_DIR=${UPLOAD_DIR}
      - LOG_LEVEL=${LOG_LEVEL}
    volumes:
      - ./uploads:/app/uploads
    networks:
      - healthcare_network
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend
  # frontend:
  #   build:
  #     context: ../front-end
  #     dockerfile: Dockerfile
  #     args:
  #       - VITE_API_URL=${VITE_API_URL}
  #       - VITE_SOCKET_URL=${VITE_SOCKET_URL}
  #       - VITE_GG_CLIENT_ID=${VITE_GG_CLIENT_ID}
  #       - VITE_GG_CLIENT_SECRET=${VITE_GG_CLIENT_SECRET}
  #   container_name: healthcare_frontend
  #   restart: always
  #   ports:
  #     - '80:80'
  #     - '443:443'
  #   depends_on:
  #     - backend
  #   networks:
  #     - healthcare_network
  #   healthcheck:
  #     test: ['CMD', 'curl', '-f', 'http://localhost/']
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 40s

volumes:
  uploads:

networks:
  healthcare_network:
    driver: bridge
